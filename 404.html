  <style>
    :root {
      --milk:   #FAF7F2;
      --sage:   #5C9957;
      --sage-dark: #3D7A28;
      --beige:  #C4A882;
      --taupe:  #3D3530;
      --taupe2: #5a4e48;
      --light:  #F2EDE4;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--milk);
      color: var(--taupe);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .wrap {
      text-align: center;
      max-width: 540px;
    }
    .logo {
      width: 120px;
      height: auto;
      margin: 0 auto 32px;
      display: block;
    }
    .code {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(96px, 20vw, 160px);
      font-weight: 300;
      color: var(--beige);
      line-height: 1;
      letter-spacing: -0.02em;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 400;
      color: var(--taupe);
      margin: 12px 0 16px;
      line-height: 1.2;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      color: var(--taupe2);
      margin-bottom: 36px;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      padding: 14px 28px;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      font-weight: 500;
      border-radius: 2px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-primary {
      background: var(--sage-dark);
      color: var(--milk);
    }
    .btn-ghost {
      background: transparent;
      color: var(--taupe);
      border: 1px solid var(--beige);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -8px rgba(61,53,48,0.3);
